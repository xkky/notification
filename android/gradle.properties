org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Gradle network settings to resolve SSL/connectivity issues
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.internal.http.socketTimeout=60000
org.gradle.internal.http.connectionTimeout=60000

# For corporate proxy (uncomment and configure if needed)
# systemProp.https.proxyHost=proxy.company.com
# systemProp.https.proxyPort=8080
# systemProp.https.proxyUser=username
# systemProp.https.proxyPassword=password
# systemProp.http.proxyHost=proxy.company.com
# systemProp.http.proxyPort=8080

# Allow offline mode if gradle cache already exists
# org.gradle.offline=true

# Build cache (recommended)
org.gradle.caching=true


# 使用 HTTP 而非 HTTPS（临时方案）
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=

# 增加超时时间
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000